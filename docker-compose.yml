name: dev-talles-containers
services:
  rabbitmq:
    image: rabbitmq:4.3.0-management-alpine
    container_name: rabbitmq
    hostname: my-devtalles-rabbitmq
    restart: on-failure:3
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  mongodb:
    image: mongo:9.0.2
    container_name: mongodb
    restart: on-failure:3
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongodb_data:/data/db

  inventory-db:
    image: mysql:9.0.1
    container_name: inventory-db
    restart: on-failure:3
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=inventory-db
      - MYSQL_USER=inventory-user
      - MYSQL_PASSWORD=inventory-password
    volumes:
      - inventory_data:/var/lib/mysql

  order-db:
    image: postgres:18.6-alpine
    container_name: order-db
    restart: on-failure:3
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=order-db
    volumes:
      - order_data:/var/lib/postgresql

  keycloak-db:
    image: postgres:18.6-alpine
    container_name: keycloak-db
    restart: on-failure:3
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
      - POSTGRES_DB=keycloak-db
    volumes:
      - keycloak_data:/var/lib/postgresql

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak-db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Credenciales del Super Admin (Para entrar a la consola administrativa)
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db

